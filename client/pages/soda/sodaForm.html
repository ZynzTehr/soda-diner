        <section>
            <h1>New Soda</h1>
            <hr />
            <form id="soda-form">
                <label>Name</label>
                <input class="form-control" type="text" name="name" />
                <label>Brand</label>
                <input class="form-control" type="text" name="brand" />
                <div class="sub-inputs">
                    <div>
                        <label>Fizziness</label>
                        <input class="form-control" type="number" min="1" max="10" name="fizziness" />                   
                    </div>
                    <div>
                        <label>Rating</label>
                        <input class="form-control" type="number" min="1" max="10" name="taste_rating"/> 
                    </div>
                </div>
                <button class="btn btn-secondary add-btn">Add Soda</button>
            </form>
            <hr />
        </section>
